<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para mi chiqui bb jorge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #111115;
      --border: #272420;
      --gold: #c9a656;
      --gold-dim: rgba(201, 166, 86, 0.25);
      --text: #eae6df;
      --muted: #9a948b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: linear-gradient(180deg, rgba(18, 18, 22, 0.95) 0%, rgba(10, 10, 13, 0.98) 100%);
      border: 1px solid var(--border);
      padding: 34px 24px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(201, 166, 86, 0.08);
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.7;
    }
    .tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
    .tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
    .bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
    .br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

    .subtitle {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Pirata One', serif;
      font-size: 2.5rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.03em;
      line-height: 1.15;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(201, 166, 86, 0.18);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 12px auto 18px;
      color: var(--gold);
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      width: 65px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .intro {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .item {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border);
      padding: 18px 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .item:hover,
    .item.active {
      border-color: var(--gold);
      background: rgba(201, 166, 86, 0.07);
      transform: translateY(-2px);
    }

    .item svg {
      width: 66px;
      height: 66px;
      margin-bottom: 10px;
      overflow: visible;
    }

    .item-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .item-tag {
      font-size: 0.76rem;
      color: var(--muted);
    }
